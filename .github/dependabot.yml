# One PR a week per ecosystem, not one per package. strata-python arrives with the Python group: read its CHANGELOG
# (every breaking line ends with the migration) before merging. A playwright or lucide-react bump in the web group
# changes the visual baselines: run "Update visual baselines" on the PR's branch. Security updates still come at once.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-app-template"
version = "0.1.0"        # the single source of truth: `app.__version__` reads it back with importlib.metadata
description = "Full-stack Python + React application template (FastAPI, CLI, strata-react)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The shared server code (settings, web serving, CLI commands, contracts, the database, the test plugin and the gate).
    # It brings FastAPI, uvicorn and pydantic at the versions it was tested with; [db] adds SQLAlchemy, Alembic and psycopg.
    # While 0.x a minor release may break, so cap below the next minor; dependabot moves the lock inside the range.
    "strata-python[db]>=0.2.6,<0.3",
    "tzdata; sys_platform == 'win32'",   # IANA timezone database, needed on Windows for zoneinfo
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
    "strata-python[dev]",   # ruff, pyright, ty, httpx and the pytest plugins at the versions strata-check expects
    "hypothesis>=6",
    "diff-cover>=9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
# The React build is gitignored but must ship in the wheel: `cd web && npm run build` before `uv build`.
artifacts = ["src/app/server/static/**"]

[tool.pytest.ini_options]
pythonpath = ["tests/utils"]
strata_env_prefix = "APP"                 # strata-python plugin: APP_HOME and APP_DATA point into a tmp dir for every test
strata_tuning_vars = ["APP_GREETING", "APP_STYLE"]    # removed from the environment for every test
testpaths = ["tests/unit"]
addopts = "-ra --timeout=300 --strict-markers --strict-config --import-mode=importlib"   # importlib: tests/unit and tests/integration may share file names
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]       # TestClient noise from the installed starlette; remove when the dependency moves on
markers = [
    "integration: runs the CLI and HTTP server end-to-end (tests/integration)",
    "slow: slow tests; run manually or on a schedule",
]

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false
# Measured from the unit suite only (tests/unit). Ratchet this up as coverage improves.
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "TID"]
ignore = ["E501"]        # the formatter wraps code; long comments and docstrings stay (the house style comments the why)

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.importorskip".msg = "Do not skip when a dependency is missing: install it (locally and in CI) and let the test fail if it is not there. A deliberate skip is a marker with a reason, see AGENTS.md (Testing)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607"]    # asserts, fake secrets, tmp paths, subprocess of our own CLI

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.strata-db]
file = "src/app/strata-db.toml"
